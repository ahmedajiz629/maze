<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Grid Puzzle 3D (TypeScript + Babylon.js)</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #181a1f;
        color: #eee;
        font-family: system-ui;
        overflow: hidden;
        display: flex;
        flex: 1;
      }
      .hud {
        position: fixed;
        left: 12px;
        top: 10px;
        font-weight: 600;
        z-index: 100;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px 16px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.2);
      }

      .hud-title {
        font-size: 14px;
        margin-bottom: 8px;
        color: #ccc;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .keys-container {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 200px;
      }

      .key-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        border: 1px solid;
      }
      .console-input {
        display: block;
      }
      .console-input > ::before {
        content: '... ';
      }
      .console-input > :first-child:before {
        content: '>>> ';
      }

      .key-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
      }

      .key-count {
        font-size: 12px;
        font-weight: bold;
      }
      .banner {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 8px;
        text-align: center;
        font-weight: 600;
        font-size: 18px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px;
        margin: 0 20px;
        border-radius: 6px;
        min-height: 20px;
      }
      .game-panel {
        flex: 1;
        position: relative;
        display: none;
      }

      .python-panel {
        flex: 1;
        background: #1e1e1e;
        border-left: 2px solid #333;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .python-header {
        background: #2d2d30;
        padding: 12px;
        border-bottom: 1px solid #444;
        font-weight: bold;
        font-size: 14px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ready-indicator {
        color: #4caf50;
        font-size: 12px;
      }

      .loading-indicator {
        color: #ffc107;
        font-size: 12px;
      }

      .current-line {
        display: inline;
      }

      .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: #d4d4d4;
        animation: blink 1s infinite;
        vertical-align: top;
        margin-left: 1px;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }

      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        z-index: 200;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .top-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        background: linear-gradient(90deg, #20232a, #282c34);
        border-bottom: 1px solid #333;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        z-index: 120;
      }

      .top-nav-brand {
        font-weight: 700;
        letter-spacing: 0.05em;
        font-size: 15px;
        text-transform: uppercase;
        color: #f5f5f5;
      }

      .top-nav-links {
        display: flex;
        gap: 8px;
      }

      .nav-link {
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 6px 14px;
        font-size: 13px;
        color: #d0d0d0;
        background: rgba(255, 255, 255, 0.04);
        text-decoration: none;
        transition: all 0.18s ease-out;
      }

      .nav-link:hover {
        border-color: rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
      }

      .nav-link-active {
        background: linear-gradient(135deg, #3f51b5, #2196f3);
        color: #fff;
        box-shadow: 0 0 12px rgba(33, 150, 243, 0.5);
      }

      .app-main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .quiz-page {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 18px;
        box-sizing: border-box;
        overflow: auto;
        background: radial-gradient(circle at top left, #292d3e, #121318);
      }

      .quiz-shell {
        width: 100%;
        max-width: 840px;
        background: rgba(18, 18, 20, 0.96);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 22px 22px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .quiz-title {
        margin: 0;
        font-size: 22px;
        color: #ffffff;
      }

      .quiz-subtitle {
        margin: 4px 0 0;
        font-size: 13px;
        color: #c0c0c0;
      }

      .quiz-score-chip {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        padding: 8px 12px;
        border-radius: 14px;
        background: rgba(46, 204, 113, 0.15);
        border: 1px solid rgba(46, 204, 113, 0.6);
        color: #e8f5e9;
        font-size: 12px;
        min-width: 110px;
      }

      .quiz-score-chip strong {
        font-size: 16px;
      }

      .quiz-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .quiz-section {
        margin-top: 8px;
      }

      .quiz-section-title {
        margin: 0 0 4px;
        font-size: 16px;
        color: #ffffff;
      }

      .quiz-section-desc {
        margin: 0 0 8px;
        font-size: 13px;
        color: #cfd8dc;
      }

      .quiz-card {
        padding: 14px 14px 12px;
        border-radius: 14px;
        background: radial-gradient(circle at top right, #263238, #15171d);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .quiz-question-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .quiz-question-number {
        background: rgba(63, 81, 181, 0.28);
        color: #e8eaf6;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11px;
      }

      .quiz-question-text {
        margin: 0;
        font-size: 15px;
        color: #ffffff;
      }

      .quiz-code-block {
        margin: 6px 0 10px;
        padding: 10px 12px;
        background: #101216;
        border-radius: 10px;
        font-family: Consolas, Menlo, Monaco, monospace;
        font-size: 12px;
        direction: ltr;
        text-align: left;
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .quiz-code-block code,
      .quiz-code-input,
      code {
        unicode-bidi: plaintext;
      }

      .quiz-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .quiz-option {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.4);
        color: #f5f5f5;
        font-size: 13px;
        cursor: pointer;
        text-align: right;
        transition: all 0.15s ease-out;
      }

      .quiz-option:hover {
        border-color: rgba(129, 199, 253, 0.8);
        box-shadow: 0 0 0 1px rgba(129, 199, 253, 0.5);
      }

      .quiz-option-selected {
        border-color: rgba(33, 150, 243, 0.9);
        background: radial-gradient(circle at top left, #1e88e5, #0d47a1);
      }

      .quiz-option-correct {
        border-color: rgba(76, 175, 80, 0.95) !important;
        background: radial-gradient(circle at top left, #2e7d32, #1b5e20) !important;
      }

      .quiz-option-wrong {
        border-color: rgba(244, 67, 54, 0.95) !important;
        background: radial-gradient(circle at top left, #c62828, #8e0000) !important;
      }

      .quiz-option-index {
        font-weight: 600;
        font-size: 12px;
        opacity: 0.9;
      }

      .quiz-option-label {
        flex: 1;
      }

      .quiz-feedback {
        margin-top: 10px;
        font-size: 12px;
        color: #e0e0e0;
      }

      .quiz-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        margin-bottom: 4px;
      }

      .quiz-badge.success {
        background: rgba(76, 175, 80, 0.18);
        color: #c8e6c9;
      }

      .quiz-badge.error {
        background: rgba(244, 67, 54, 0.2);
        color: #ffcdd2;
      }

      .quiz-explanation {
        margin: 0;
        color: #cfd8dc;
      }

      .quiz-code-input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #101216;
        color: #e0e0e0;
        font-family: Consolas, Menlo, Monaco, monospace;
        font-size: 12px;
        resize: vertical;
      }

      .quiz-footer {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
        margin-top: 4px;
      }

      .quiz-primary-btn,
      .quiz-secondary-btn {
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .quiz-primary-btn {
        background: linear-gradient(135deg, #42a5f5, #1e88e5);
        color: #fff;
        box-shadow: 0 6px 16px rgba(33, 150, 243, 0.5);
      }

      .quiz-primary-btn:disabled {
        opacity: 0.6;
        cursor: default;
        box-shadow: none;
      }

      .quiz-secondary-btn {
        background: transparent;
        color: #bbdefb;
        border: 1px solid rgba(187, 222, 251, 0.8);
      }

      @media (max-width: 768px) {
        .quiz-shell {
          padding: 16px 12px 12px;
        }

        .top-nav {
          padding-inline: 10px;
        }

        .quiz-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/ui-manager.ts"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log(
                "Service Worker registered successfully:",
                registration.scope
              );
            })
            .catch((error) => {
              console.log("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
